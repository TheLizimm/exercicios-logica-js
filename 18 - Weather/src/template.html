<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>
    <div id="main-content">
      <div class="ContentInfo">
        <form id="formBusca">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M576 112C576 100.9 570.3 90.6 560.8 84.8C551.3 79 539.6 78.4 529.7 83.4L413.5 141.5L234.1 81.6C226 78.9 217.3 79.5 209.7 83.3L81.7 147.3C70.8 152.8 64 163.9 64 176L64 528C64 539.1 69.7 549.4 79.2 555.2C88.7 561 100.4 561.6 110.3 556.6L226.4 498.5L405.8 558.3C413.9 561 422.6 560.4 430.2 556.6L558.2 492.6C569 487.2 575.9 476.1 575.9 464L575.9 112zM256 440.9L256 156.4L384 199.1L384 483.6L256 440.9z"/></svg>
          <input  type="text"  id="termoBusca"  name="termoBusca"  placeholder="Buscar Cidade"/>
          <button type="submit">Buscar</button>
        </form>
        <div id="alert"></div>
        <div id="weather">
          <h1 id="title">Rolante, BR</h1>
          <div id="infos">
            <div id="temp">
              <img  id="temp_img"  src="http://openweathermap.org/img/wn/04d@2x.png"/>
              <div>
                <p id="temp_value">32</p>
                <p id="temp_description">Ensolarado</p>
              </div>
            </div>
            <div id="other_infos">
              <div class="info">
                <i id="temp_max_icon" class="fa-solid fa-temperature-high"></i>
                <div>
                  <h2>Temp. max</h2>
                  <p id="temp_max">32 <sup>C°</sup></p>
                </div>
              </div>
              <div class="info">
                <i id="temp_min_icon" class="fa-solid fa-temperature-low"></i>
                <div>
                  <h2>Temp. min</h2>
                  <p id="temp_min">12 <sup>C°</sup></p>
                </div>
              </div>
              <div class="info">
                <i id="humidity_icon" class="fa-solid fa-droplet"></i>
                <div>
                  <h2>Humidade</h2>
                  <p id="humidity">50%</p>
                </div>
              </div>
              <div class="info">
                <i id="wind_icon" class="fa-solid fa-wind"></i>
                <div>
                  <h2>Vento</h2>
                  <p id="wind">50 km/h</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
